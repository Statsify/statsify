packages:
  - apps/**
  - packages/**
  - '!packages/skin-renderer/pkg'

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  sharp: true
  skia-canvas: true
  unrs-resolver: true

patchedDependencies:
  # Stops skyhelper-networth fetching (npm update check, prices, the items resource) and reading or writing its items backup
  skyhelper-networth@2.11.1: patches/skyhelper-networth@2.11.1.patch
