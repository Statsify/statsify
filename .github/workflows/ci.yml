name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  checks: write
  contents: write

# A new push to a pull request cancels the run for the old commit. Each run on main gets its
# own group, so every commit there still gets a result and none waits behind another
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node.js v24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The skin renderer's Rust builds take about 4 minutes from scratch, and turbo's cache
      # usually skips them. Ask turbo first, using the same commands as the steps below, and
      # only set up Rust when one of its tasks will run
      - name: Check for Rust work
        id: rust
        run: |
          if pnpm --silent build --dry=json > "$RUNNER_TEMP/build.json" &&
            pnpm --silent exec turbo run lint:ci typecheck --affected --dry=json > "$RUNNER_TEMP/check.json"; then
            needed=$(jq -s '[.[].tasks[] | select(.package == "@statsify/skin-renderer" and .cache.status != "HIT")] | length > 0' "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/check.json")
          else
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      # Caches compiled crates and the wasm-bindgen and wasm-opt binaries wasm-pack downloads
      - name: Rust cache
        if: steps.rust.outputs.needed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: ~/.cache/.wasm-pack
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        if: steps.rust.outputs.needed == 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # One turbo run so lint and typecheck share a task graph and run side by side. Build
      # stays a separate step after them, so neither check can read a half-written dist folder
      - name: Lint and typecheck
        run: pnpm exec turbo run lint:ci typecheck --affected --continue=dependencies-successful

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:coverage --changed=$TURBO_SCM_BASE
