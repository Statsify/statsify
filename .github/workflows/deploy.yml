name: Deploy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  checks: write
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    name: Images
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy:
    name: Deploy
    needs: images
    runs-on: core
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: compose.prod.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start containers
        run: docker compose -f compose.prod.yml up -d --pull always --remove-orphans --wait --wait-timeout 300
        env:
          TAG: ${{ github.sha }}

      - name: Remove old images
        run: docker image prune -af --filter "label=org.opencontainers.image.source=https://github.com/Statsify/statsify" --filter "until=336h"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
