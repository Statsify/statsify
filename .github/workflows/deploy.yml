name: Deploy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  checks: write
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: core
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.REPO_PAT }}
          submodules: recursive

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Code
        run: pnpm scripts purge-repo --dist && pnpm build --force
        env:
          # The site's Sentry release (apps/site/turbo.json passes it to the site's build), so its errors match the
          # sourcemaps uploaded below.
          VITE_SENTRY_RELEASE: ${{ github.ref_name }}

      - name: Upload Site Sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_SITE_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN is not set, so the site's sourcemaps are not uploaded"
            exit 0
          fi
          npx --yes @sentry/cli@2 sourcemaps upload --release "${{ github.ref_name }}" --url-prefix "~/assets" apps/site/.output/public/assets

      - name: Remove Site Sourcemaps
        # Once they're uploaded, or the upload is skipped, so the site doesn't serve them.
        run: rm -f apps/site/.output/public/assets/*.map

      - name: Prepare Assets
        run: pnpm scripts blur-backgrounds

      - name: Move Config
        run: cp /home/config.js ./config.js

      - name: Restart PM2
        run: npx pm2 restart pm2.config.cjs
