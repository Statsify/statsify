name: Deploy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  checks: write
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: core
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.REPO_PAT }}
          submodules: recursive

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Code
        run: pnpm scripts purge --dist && pnpm build --force

      - name: Prepare Assets
        run: cd assets/private && pnpm blur && cd ../../

      - name: Move Config
        run: cp /home/config.js ./config.js

      - name: Restart PM2
        run: |
          # pm2 restart keeps the running daemon on its old version, so update it when pm2 changes
          daemon=$(node -e 'const pm2 = require("pm2"); pm2.connect(() => pm2.getVersion((_, version) => { console.log(version); process.exit(0); }))')
          [ "$daemon" = "$(node -p 'require("pm2/package.json").version')" ] || npx pm2 update
          npx pm2 restart pm2.config.cjs
