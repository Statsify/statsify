name: Deploy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    name: Deploy
    runs-on: core
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.REPO_PAT }}
          submodules: recursive
          persist-credentials: false

      # Compose reads TAG from here, so manual compose commands on the server use the deployed images
      - name: Save the deployed commit
        run: echo "TAG=$GITHUB_SHA" > .env

      # Runs before the new containers start, so the running deploy's images stay for a rollback
      - name: Remove old images
        run: docker image prune -af --filter "label=org.opencontainers.image.source=https://github.com/Statsify/statsify" --filter "until=336h"

      - name: Build images
        run: docker compose -f compose.prod.yml build --pull

      - name: Start containers
        run: docker compose -f compose.prod.yml up -d --remove-orphans --wait
