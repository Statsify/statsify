name: statsify

x-app: &app
  restart: unless-stopped
  network_mode: host
  init: true
  environment:
    FORCE_COLOR: 3
    NODE_OPTIONS: --unhandled-rejections=warn
    # Sentry reads this to tag errors with the deploy they came from
    SENTRY_RELEASE: ${TAG:?}
  volumes:
    - /home/config.js:/app/config.js:ro
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Redis runs in its own compose project on the box, so deploys never restart it
services:
  api:
    <<: *app
    image: ghcr.io/statsify/statsify:api-${TAG:?}
    volumes:
      - /home/config.js:/app/config.js:ro
      # The same path as api.mediaRoot in the config
      - /media:/media

  discord-bot:
    <<: *app
    image: ghcr.io/statsify/statsify:discord-bot-${TAG:?}

  support-bot:
    <<: *app
    image: ghcr.io/statsify/statsify:support-bot-${TAG:?}

  verify-server:
    <<: *app
    image: ghcr.io/statsify/statsify:verify-server-${TAG:?}

  leaderboard-limiting:
    <<: *app
    image: ghcr.io/statsify/statsify:scripts-${TAG:?}
    command: node src/limit-redis.js
