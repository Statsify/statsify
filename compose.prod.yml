name: statsify

x-app: &app
  restart: unless-stopped
  network_mode: host
  init: true
  environment:
    FORCE_COLOR: 3
    NODE_OPTIONS: --unhandled-rejections=warn
    SENTRY_RELEASE: ${TAG:?}
  volumes:
    - /home/config.js:/app/config.js:ro
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Redis runs in its own compose project on the box, so deploys never restart it
services:
  api:
    <<: *app
    image: statsify-api:${TAG:?}
    build:
      args:
        APP: api
    # Any response means the API is up, so a deploy fails when it doesn't start
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "import { config } from '@statsify/util'; await fetch('http://localhost:' + await config('api.port'));"]
      interval: 10s
      start_period: 1m
    volumes:
      - /home/config.js:/app/config.js:ro
      # The same path as api.mediaRoot in the config
      - /media:/media

  discord-bot:
    <<: *app
    image: statsify-discord-bot:${TAG:?}
    build:
      args:
        APP: discord-bot
    volumes:
      - /home/config.js:/app/config.js:ro
      # The packs item icons draw from, kept across deploys instead of downloaded again
      - resource-packs:/app/assets/public/resource-packs

  support-bot:
    <<: *app
    image: statsify-support-bot:${TAG:?}
    build:
      args:
        APP: support-bot

  verify-server:
    <<: *app
    image: statsify-verify-server:${TAG:?}
    build:
      args:
        APP: verify-server

  leaderboard-limiting:
    <<: *app
    image: statsify-scripts:${TAG:?}
    build:
      args:
        APP: scripts
    command: node src/limit-redis.js

volumes:
  resource-packs:
