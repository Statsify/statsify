name: statsify

x-app: &app
  restart: unless-stopped
  network_mode: host
  init: true
  environment:
    FORCE_COLOR: 3
    NODE_OPTIONS: --unhandled-rejections=warn
    SENTRY_RELEASE: ${TAG:?}
  volumes:
    - /home/config.js:/app/config.js:ro
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Redis runs in its own compose project on the box, so deploys never restart it
services:
  api:
    <<: *app
    image: statsify-api:${TAG:?}
    build:
      args:
        APP: api
    volumes:
      - /home/config.js:/app/config.js:ro
      # The same path as api.mediaRoot in the config
      - /media:/media

  discord-bot:
    <<: *app
    image: statsify-discord-bot:${TAG:?}
    build:
      args:
        APP: discord-bot

  support-bot:
    <<: *app
    image: statsify-support-bot:${TAG:?}
    build:
      args:
        APP: support-bot

  verify-server:
    <<: *app
    image: statsify-verify-server:${TAG:?}
    build:
      args:
        APP: verify-server

  leaderboard-limiting:
    <<: *app
    image: statsify-scripts:${TAG:?}
    build:
      args:
        APP: scripts
    command: node src/limit-redis.js
